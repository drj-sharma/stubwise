name: backend

on:
  pull_request:
    paths: ["apps/backend/**", "packages/domain/parity/**"]
  push:
    branches: [main]
    paths: ["apps/backend/**", "packages/domain/parity/**"]

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/backend

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stubwise
          POSTGRES_PASSWORD: stubwise
          POSTGRES_DB: stubwise_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U stubwise" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: apps/backend/uv.lock
      - run: uv python install 3.11
      - run: uv sync --frozen
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Tax data is the generated copy
        run: uv run python scripts/sync_tax_data.py --check
      - name: Tests (SQLite), including parity with packages/domain
        run: uv run pytest -q
      - name: Tests (Postgres)
        env:
          TEST_DATABASE_URL: postgresql://stubwise:stubwise@127.0.0.1:5432/stubwise_test
        run: uv run pytest -q

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build the image and check it starts
        run: |
          docker compose -f docker-compose.backend.yml up --build -d
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4000/ready; then exit 0; fi
            sleep 2
          done
          docker compose -f docker-compose.backend.yml logs
          exit 1
