[project]
name = "stubwise-backend"
version = "0.1.0"
description = "CrewStub backend: accounts with Google and Apple sign-in, records, pay and tax calculation, backup, and parked tax form filing."
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.14",
    "fastapi>=0.115",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pyjwt[crypto]>=2.9",
    "sqlalchemy>=2.0.36",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = [
    "B008", # FastAPI's Depends() in argument defaults is the framework's idiom
    "RUF012", # pydantic copies field defaults per instance; ruff cannot see that through our base Model
    "SIM905", # a split() string reads better than sixty one-item lines for the state list
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S608"]
